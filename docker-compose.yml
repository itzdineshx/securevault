version: "3.8"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: securevault-backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./securevault.db:/app/securevault.db
    environment:
      - DATABASE_URL=sqlite:///./securevault.db
      - CORS_ALLOW_ORIGINS=http://localhost:8501

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: securevault-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
